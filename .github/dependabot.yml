version: 2
updates:
  # Both Go modules are dependency-free today; these entries mostly track the
  # `go` directive / toolchain, and exist so any future dependency is watched.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: gomod
    directory: /sdk/akg-go
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /sdk/akg-ts
    schedule:
      interval: weekly
    ignore:
      # @types/node tracks the engines floor (node >=22), not the latest Node,
      # so the type checker rejects APIs newer than the oldest supported runtime.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
